<div class="employee-container">
  <h2>Employee Form</h2>

  <div class="form-group">
    <label>Name</label>
    <input type="text" placeholder="Enter employee name" [(ngModel)]="name" />
  </div>

  <div class="form-group">
    <label>Age</label>
    <input type="number" placeholder="Enter employee age" [(ngModel)]="age" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" placeholder="Enter employee email" [(ngModel)]="email" />
  </div>

  <div class="form-group">
    <label>Department</label>
    <input type="text" placeholder="Enter department" [(ngModel)]="department" />
  </div>
  <button (click)="showMessage()">Submit</button>
  <hr />

  <div class="employee-details" appHighlight>
    <h3>Employee Details</h3>

    <p>Employee Name: {{ name }}</p>
    <p>Employee Age: {{ age }}</p>
    <p>Employee Email: {{ email }}</p>
    <p>Employee Department: {{ department }}</p>
  </div>

</div>
