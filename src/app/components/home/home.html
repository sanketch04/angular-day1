<h1>Day 2</h1>
<button (click)="showEmployee = !showEmployee">show /hide Employee</button>
<div *ngIf="showEmployee">
  <div *ngFor="let employee of employees">
    <p>Name: {{ employee.name | capitalize }}</p>
    <p>Age: {{ employee.age }}</p>
    <p>Department: {{ employee.department | uppercase }}</p>
    <hr />
  </div>
</div>
