<div class="student-container">
  <div class="page-header">
    <h2>Students From API</h2>
    <p>Student data loaded from a fake API</p>
  </div>

  <div class="student-grid">
    <div class="student-card" *ngFor="let student of students">
      <div class="student-info">
        <h3>{{ student.name }}</h3>

        <div class="info-row">
          <span class="label">ID</span>
          <span>{{ student.id }}</span>
        </div>

        <div class="info-row">
          <span class="label">Username</span>
          <span>{{ student.username }}</span>
        </div>

        <div class="info-row">
          <span class="label">Email</span>
          <span>{{ student.email }}</span>
        </div>

        <div class="info-row">
          <span class="label">Phone</span>
          <span>{{ student.phone }}</span>
        </div>

        <div class="info-row">
          <span class="label">Website</span>
          <span>{{ student.website }}</span>
        </div>

        <!-- View Details -->
        <a [routerLink]="['/students', student.id]" class="details-button"> View Details </a>
      </div>
    </div>
  </div>
</div>
