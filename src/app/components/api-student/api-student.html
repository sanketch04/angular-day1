<div class="student-container">

  <div class="page-header">
    <h2>Students From API</h2>
    <p>Student data loaded from the ASP.NET Core API</p>
  </div>

  <div class="student-grid">

    <div class="student-card" *ngFor="let student of students">

      <!-- Image -->
      <div class="student-image">

        <img
          *ngIf="student.imagePath; else noImage"
          [src]="getImageUrl(student.imagePath)"
          [alt]="student.name"
        />

        <ng-template #noImage>
          <div class="no-image">
            No Image
          </div>
        </ng-template>

      </div>

      <!-- Student Information -->
      <div class="student-info">

        <h3>{{ student.name }}</h3>

        <div class="info-row">
          <span class="label">ID</span>
          <span>{{ student.id }}</span>
        </div>

        <div class="info-row">
          <span class="label">Address</span>
          <span>{{ student.address }}</span>
        </div>

        <div class="info-row">
          <span class="label">Department</span>
          <span>{{ student.departmentName }}</span>
        </div>

        <div class="info-row">
          <span class="label">Gender</span>
          <span>{{ student.gender }}</span>
        </div>

      </div>

    </div>

  </div>

</div>
